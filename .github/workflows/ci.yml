# GODSEYE CI: every push and pull request must pass a placeholder check, lint, typecheck, unit
# tests with the 80 % line-coverage gate, a production build, Playwright e2e (in the official
# Playwright image, SwiftShader WebGL), Lighthouse CI on ubuntu-24.04 (/docs and /privacy against
# the contract thresholds; / against a separate software-GL budget, every scored run verified to
# have drawn the globe) and a production dependency audit. Optionally, when the repository variable
# LIGHTHOUSE_GPU_RUNNER names a GPU runner, / is also measured on a hardware GPU against the
# contract thresholds.
# Actions are pinned to full commit SHAs (tag in the trailing comment), images to digests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Switch: "1" makes src/lib/api-catalog.test.ts require a route file for every catalogue entry.
  # Off until every Phase 2 route has merged; the lead flips it (TODO.md).
  CHECK_CATALOG_COMPLETENESS: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests (coverage gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shipped docs never carry placeholders (the contract and the research pack are exempt;
      # "TODO.md" as a file name is allowed). tools/ops-config.test.ts runs the same check.
      - name: No placeholders in LICENSE, README or docs
        run: |
          if grep -rnIP '(?i:none yet)|\bTODO\b(?!\.md)|\bFIXME\b|\bTBD\b|(?i:lorem ipsum)' LICENSE README.md docs \
              --exclude-dir=reference --exclude=OPUS_5_5_BUILD_PROMPT.md; then
            echo "::error::placeholder text found (see lines above)"
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      # Includes the docs/API.md and docs/DATA_SOURCES.md freshness checks (tools/*.test.ts).
      - run: pnpm test:coverage
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Dependency audit (production, high+)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: Build + Playwright e2e (official Playwright image)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Same image the screenshot baselines are generated in; Chromium renders WebGL through
    # SwiftShader (flags in playwright.config.ts). Tag must match @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` runs the prebuild hook that vendors the MapLibre worker.
      - run: pnpm build
      # playwright.config.ts starts `pnpm start` itself (webServer) and never reuses a server in CI.
      # The map specs wait up to 90 s for the first WebGL canvas under SwiftShader (e2e/map-engine/helpers.ts);
      # the per-test budget is raised so those waits can run to completion (assertions unchanged).
      - run: pnpm e2e --timeout=150000
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse-pages:
    name: Build + Lighthouse CI (/docs, /privacy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Thresholds in lighthouserc.json equal the contract (perf >= 0.85, a11y = 1, LCP <= 2.5 s,
      # CLS <= 0.1, TBT <= 300 ms; lighthouserc.gpu.json asserts the same, enforced by
      # tools/ops-config.test.ts). These pages draw no WebGL, so SwiftShader flags are harmless here.
      # Uses the runner's preinstalled Google Chrome. Reports stay in the workflow artifacts; nothing is
      # uploaded to public storage.
      - name: Lighthouse CI
        run: pnpm lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-pages
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  # / (the WebGL globe) on every run, on the runner every other job uses. GitHub's standard runners
  # have no GPU, so Chromium draws the globe with SwiftShader on the CPU, and / is held to a separate,
  # documented software-GL budget (lighthouserc.home.json; README.md, "Lighthouse on /"): performance
  # >= 0.45 and TBT <= 13500 ms, derived from the measured CI history of / under SwiftShader
  # (perf 0.53-0.56, TBT 3.4-11.2 s, 60 runs; the job ids are in tools/ops-config.test.ts), with
  # accessibility = 1, LCP <= 2.5 s and CLS <= 0.1 at the contract values. It catches regressions; it
  # does NOT show that / meets the contract's performance and TBT targets, which assume a GPU (the
  # optional job lighthouse-gpu measures that).
  # Every scored run carries the in-run audit godseye-map-globe-drawn (tools/lighthouse/), asserted on
  # every run: a run that measured the WEBGL2 REQUIRED or BASEMAP UNAVAILABLE fallback (also one that
  # recovered from it before the end of the load), a blank canvas or a globe without its OpenFreeMap
  # basemap fails the gate; so does a run while OpenFreeMap is unreachable. Same Chrome (the runner's
  # preinstalled Google Chrome), flags and desktop settings as the history the budget comes from.
  # Never skipped.
  # A separate job rather than a step of lighthouse-pages: the existing required check
  # "Build + Lighthouse CI (/docs, /privacy)" keeps its name and meaning, the check name says which
  # threshold failed, and both run in parallel (one extra build).
  lighthouse-home:
    name: Build + Lighthouse CI (/, software-GL budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Collect three runs of / (tools/lighthouse/home-config.mjs: desktop config plus the in-run audit),
      # assert lighthouserc.home.json, write the reports.
      - name: Lighthouse CI on / (software-GL budget)
        run: pnpm lhci:home
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-home
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  # Optional: / (the WebGL globe) against the contract thresholds on a hardware GPU, the measurement
  # the software-GL budget above cannot make. It runs only when the repository variable
  # LIGHTHOUSE_GPU_RUNNER names a GPU runner: a runner label (for example gpu-t4-4core) or a JSON
  # array of labels (for example ["self-hosted","linux","x64","godseye-gpu"]). README.md, "Optional:
  # GPU runner for Lighthouse on /", says how to provision one. While the variable is empty the job is
  # skipped (GitHub reports a skipped job as success to required checks): never red, never queued,
  # never measured on software GL.
  # With the variable set, a run from a fork goes to ubuntu-24.04 and its first step fails within
  # seconds ("not measured", never green), and a label that no online runner carries (mistyped,
  # runner offline, billing blocked) leaves the job Queued (up to 24 h, then it fails).
  # This routing only keeps unmodified runs off the GPU runner; it is neither a cost guard nor a
  # security boundary against forks (a fork pull request runs its own copy of this file): the
  # fork-approval setting (both options) and, on a self-hosted runner, the pre-job hook described in
  # the README are.
  lighthouse-gpu:
    name: Build + Lighthouse CI (/, GPU runner)
    if: ${{ vars.LIGHTHOUSE_GPU_RUNNER != '' }}
    runs-on: ${{ (vars.LIGHTHOUSE_GPU_RUNNER != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && (startsWith(vars.LIGHTHOUSE_GPU_RUNNER, '[') && fromJSON(vars.LIGHTHOUSE_GPU_RUNNER) || vars.LIGHTHOUSE_GPU_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GPU_RUNNER: ${{ vars.LIGHTHOUSE_GPU_RUNNER }}
      TRUSTED_SOURCE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Require a GPU runner and a trusted source
        run: |
          if [ "$TRUSTED_SOURCE" != "true" ]; then
            echo "::error title=Lighthouse on / not measured::Pull requests from forks never run on the GPU runner. A maintainer re-runs the reviewed change from a branch of this repository."
            exit 1
          fi
          if [ -z "$GPU_RUNNER" ]; then
            echo "::error title=Lighthouse on / not measured::The repository variable LIGHTHOUSE_GPU_RUNNER is empty in this run. Set it under Settings > Secrets and variables > Actions > Variables to the GPU runner's label or a JSON array of labels (README.md, 'Optional: GPU runner for Lighthouse on /')."
            exit 1
          fi
          echo "Running on $RUNNER_NAME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lighthouse and the renderer check share Playwright's Chromium build (pinned by @playwright/test;
      # it ships its own Vulkan loader, the GPU driver provides the Vulkan ICD). A GitHub-hosted runner
      # installs the system libraries with apt; a self-hosted runner has them preinstalled (README) and
      # this workflow never runs sudo there.
      - name: Install Chromium (GitHub-hosted runner)
        if: runner.environment == 'github-hosted'
        run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: Install Chromium (self-hosted runner)
        if: runner.environment == 'self-hosted'
        run: pnpm exec playwright install --no-shell chromium
      - name: Point Lighthouse CI at that Chromium (CHROME_PATH)
        run: echo "CHROME_PATH=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      # Diagnostics only (never fails the job); the checks below are the gate.
      - name: GPU diagnostics
        run: |
          if command -v nvidia-smi > /dev/null; then nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv || echo "nvidia-smi failed"; else echo "nvidia-smi not found"; fi
          ls -l /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2> /dev/null || echo "no Vulkan ICD manifests in /usr/share/vulkan/icd.d or /etc/vulkan/icd.d"
          "$CHROME_PATH" --version || echo "chrome --version failed"
      - run: pnpm build
      # Fast pre-filter, so a runner without hardware WebGL2 never spends minutes on Lighthouse: a separate
      # Playwright launch of the same binary (CHROME_PATH) with the config's chromeFlags (other launcher
      # defaults differ from Lighthouse's). Fails unless WebGL2 runs on a hardware GPU on a blank canvas and
      # on the MapLibre canvas of /, served by the config's own start command (SwiftShader, llvmpipe,
      # lavapipe, any "software" renderer, a performance-caveat context or no WebGL2 all fail).
      # Evidence: the job summary and .lighthouseci/gpu-renderer.json.
      - name: Hardware WebGL2 pre-check (same Chromium binary and chromeFlags)
        run: pnpm lhci:gpu:check
      # Three runs; every one carries the in-run audit godseye-map-webgl-hardware (tools/lighthouse/),
      # which reads the renderer of the globe in the page load being scored. Refuses to start without a
      # passing pre-check on record.
      - name: Lighthouse CI on / (GPU), collect
        run: |
          node -e "const e=JSON.parse(require('fs').readFileSync('.lighthouseci/gpu-renderer.json','utf8'));process.exit(e.ok===true?0:1)" || { echo "::error title=Lighthouse on / not measured::No passing hardware-WebGL2 pre-check in .lighthouseci/gpu-renderer.json"; exit 1; }
          pnpm exec lhci collect --config=./lighthouserc.gpu.json
      # Authoritative: every scored run drew the globe on a hardware GPU (in-run audit), loaded the MapLibre
      # worker and basemap vector tiles, logged no WebGL error, used the desktop settings and the pre-checked
      # Chromium; the run count matches; the GPU is still there afterwards. The job summary quotes each
      # run's renderer and scores. Evidence: .lighthouseci/gpu-runs.json.
      - name: Verify every scored run drew the globe on a hardware GPU
        run: pnpm lhci:gpu:verify
      - name: Lighthouse CI on / (GPU), assert the contract thresholds
        run: pnpm exec lhci assert --config=./lighthouserc.gpu.json
      - name: Lighthouse CI on / (GPU), write reports
        run: pnpm exec lhci upload --config=./lighthouserc.gpu.json
      - name: Upload Lighthouse reports and renderer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-gpu
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
